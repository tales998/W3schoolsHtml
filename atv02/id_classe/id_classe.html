<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id_classe</title>
    <style>
        .classe{
            background-color: beige;
            text-align: center;
            color: brown;
            
        }
        #teste{
            background-color: aqua;
            text-align: right;
            color: rgb(80, 72, 72)
        }
    </style>
</head>
<body>
    <h3 class="classe">teste usando só a classe</h3>
    <h3 id="teste">teste usando só o id</h3>

    <h3  id="teste" class="classe" >agora usando os dois</h3>
    <p>percebe que o id sobressaiu a classe</p>
</body>
</html>
