<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>outras listas</title>
</head>
<body>
    <dl>
        <dt>mesa</dt>
        <dd>utilizada para por coisas em cima</dd>
        <dt>cadeira</dt>
        <dd>utilizada para a pessoa sentar</dd>

</body>
