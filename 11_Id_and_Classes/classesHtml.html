<!DOCTYPE html>
<html>
<head>

<style>
.city {
  background-color: tomato;
  color: white;
  border: 2px solid black;
  margin: 20px;
  padding: 20px;
}
.note {
  font-size: 120%;
  color: red;
}
.centralizacao {
    text-align: center;

}
</style>
</head>
<body>

<h1>Usando a class você pode <span class="note">criar um estilo apenas uma vez</span> e usá-la mais de uma vez</h1>

<div class="city centralizacao">
<h2>São Paulo</h2>

</div> 

<div class="city centralizacao">
<h2>Rio de Janeiro</h2>

</div>

<div class="city">
<h2>Salvador</h2>

</div>

</body>
</html>
